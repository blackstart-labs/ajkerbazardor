app:api:
  - changed-files:
      - any-glob-to-any-file: 'apps/api/**'

app:web:
  - changed-files:
      - any-glob-to-any-file: 'apps/web/**'

app:admin:
  - changed-files:
      - any-glob-to-any-file: 'apps/admin/**'

pkg:shared:
  - changed-files:
      - any-glob-to-any-file: 'packages/shared/**'

pkg:ui:
  - changed-files:
      - any-glob-to-any-file: 'packages/ui/**'

database:
  - changed-files:
      - any-glob-to-any-file: 'apps/api/drizzle/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.husky/**'
          - '.lintstagedrc.json'
          - 'commitlint.config.ts'
          - 'eslint.config.js'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'LICENSE'
